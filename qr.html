<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Inventory - Scan for Services Finder</title>
    <meta name="theme-color" content="#00adb5">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        :root {
            --bg-main: #141923;
            --bg-card: #1e2530;
            --accent: #00adb5;
            --text-main: #eef2f7;
            --text-muted: #8a99ad;
            --border: #2d3748;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            max-width: 780px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 22px;
        }
        h1 { margin: 0; font-size: 1.3rem; color: var(--accent); }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .card {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        }
        .card img { display: block; width: min(78vw, 400px); height: auto; }
        .url {
            font-family: monospace;
            font-size: 1rem;
            color: var(--accent);
            margin-top: 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            word-break: break-all;
            text-align: center;
        }
        .hint { color: var(--text-muted); font-size: 0.9rem; margin-top: 12px; text-align: center; max-width: 520px; }
    </style>
</head>
<body>

    <header>
        <h1>Scan for Services Finder</h1>
    </header>

    <div class="card">
        <img id="qr" src="/qr.png" alt="QR code for {{.URL}}">
    </div>

    <div class="url">{{.URL}}</div>
    <p class="hint">
        <strong>Google Lens</strong> and most camera apps can open this QR code &mdash; point one
        at the code and tap the link it finds.
    </p>

    <script>
        // Enable home-screen install (requires a secure context, e.g. localhost).
        if ('serviceWorker' in navigator && window.isSecureContext) {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
        }
        // Keep the QR current if the phone's address changes.
        setInterval(function () {
            document.getElementById('qr').src = '/qr.png?' + Date.now();
        }, 30000);
    </script>

</body>
</html>
